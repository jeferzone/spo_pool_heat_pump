<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Card README shot</title>
  <style>
    html, body { margin: 0; background: #2a2d33; color: #dce0e6; font: 15px/1.3 "Segoe UI", Roboto, sans-serif; }
    .sheet { box-sizing: border-box; padding: 20px 24px 24px; width: max-content; }
    .title { font-size: 15px; font-weight: 500; color: #dce0e6; margin: 0 0 14px; }
    .row { display: flex; gap: 28px; align-items: flex-start; }
    .col { width: 450px; }
    .cap { font-size: 12px; color: #a0a6ae; margin: 0 0 8px; }
    spo-pool-heat-pump-card { display: block; }
    ha-card { display: block; }

    .light {
      --font: "Segoe UI", Roboto, sans-serif;
      --primary-text-color: #212121;
      --secondary-text-color: #5f6368;
      --card-background-color: #fff;
      --divider-color: #e8eaed;
      --ha-card-border-color: #e0e0e0;
      --ha-card-border-radius: 12px;
      --primary-color: #03a9f4;
      --state-climate-heat-color: #ff8100;
      --state-climate-cool-color: #2b9af9;
      --state-climate-idle-color: #8a8a8a;
      --state-climate-off-color: #8a8a8a;
      color: var(--primary-text-color);
      font-family: var(--font);
    }
    .dark {
      --font: "Segoe UI", Roboto, sans-serif;
      --primary-text-color: #e1e1e1;
      --secondary-text-color: #9b9b9b;
      --card-background-color: #1c1c1c;
      --divider-color: #2c2c2c;
      --ha-card-border-color: #2c2c2c;
      --ha-card-border-radius: 12px;
      --primary-color: #03a9f4;
      --state-climate-heat-color: #ff8100;
      --state-climate-cool-color: #2b9af9;
      --state-climate-idle-color: #9b9b9b;
      --state-climate-off-color: #9b9b9b;
      color: var(--primary-text-color);
      font-family: var(--font);
    }
  </style>
</head>
<body>
  <div class="sheet" id="sheet">
    <p class="title" id="title">Circuit — heating</p>
    <div class="row">
      <div class="col light">
        <p class="cap">Light · 450 px</p>
        <spo-pool-heat-pump-card id="card-light"></spo-pool-heat-pump-card>
      </div>
      <div class="col dark">
        <p class="cap">Dark · 450 px</p>
        <spo-pool-heat-pump-card id="card-dark"></spo-pool-heat-pump-card>
      </div>
    </div>
  </div>
  <script>
    customElements.define("home-assistant", class extends HTMLElement {});
    customElements.define("ha-card", class extends HTMLElement {
      connectedCallback() {
        this.style.display = "block";
        this.style.background = "var(--card-background-color)";
        this.style.borderRadius = "var(--ha-card-border-radius, 12px)";
        this.style.border = "1px solid var(--ha-card-border-color)";
        this.style.overflow = "hidden";
      }
    });
  </script>
  <script type="module">
    import "/custom_components/spo_pool_heat_pump/www/spo-pool-heat-pump-card.js";

    const PRESETS = {
      "circuit-heating": {
        title: "Circuit — heating",
        schematic: "circuit",
        climate: "heat",
        activity: "Heating",
        inlet: 22.5, outlet: 25.0, ambient: 20.5, target: 31.0,
        kw: 1.6, kwh: 8.4, pct: 94, fan: 900,
      },
      "section-cooling": {
        title: "Section — cooling",
        schematic: "section",
        climate: "cool",
        activity: "Cooling",
        inlet: 29.6, outlet: 26.8, ambient: 33.2, target: 27.0,
        kw: 1.7, kwh: 6.1, pct: 98, fan: 900,
      },
    };

    const kind = new URLSearchParams(location.search).get("kind") || "circuit-heating";
    const p = PRESETS[kind] || PRESETS["circuit-heating"];
    document.getElementById("title").textContent = p.title;
    document.title = p.title;

    function st(id, state, extra = {}) {
      return { entity_id: id, state: String(state), attributes: extra };
    }

    function mockHass() {
      const climate = "climate.pool_heat_pump";
      const device = "readme";
      const sensors = {
        inlet: p.inlet, outlet: p.outlet, ambient: p.ambient,
        power: p.kw, energy_24h: p.kwh, compressor: p.pct, fan: p.fan,
      };
      const states = {
        [climate]: st(climate, p.climate, {
          temperature: p.target,
          current_temperature: p.inlet,
          hvac_modes: ["off", "heat", "cool", "heat_cool"],
          preset_modes: ["none", "silent"],
          activity: p.activity,
          target_temp_step: 0.5,
        }),
      };
      const entities = {
        [climate]: { device_id: device, platform: "spo_pool_heat_pump" },
      };
      for (const [key, value] of Object.entries(sensors)) {
        const id = `sensor.pool_heat_pump_${key}`;
        states[id] = st(id, value);
        entities[id] = { device_id: device, translation_key: key };
      }
      return {
        user: { is_admin: true },
        states,
        entities,
        callService() {},
        callWS: async () => ({}),
      };
    }

    await customElements.whenDefined("spo-pool-heat-pump-card");
    const hass = mockHass();
    for (const id of ["card-light", "card-dark"]) {
      const el = document.getElementById(id);
      el.setConfig({
        entity: "climate.pool_heat_pump",
        schematic: p.schematic,
        animation: true,
        settings: true,
      });
      el.hass = hass;
    }
    document.documentElement.dataset.ready = "1";
  </script>
</body>
</html>
